# Local development only. On Unraid, use deploy/unraid/manifold.xml.
services:
  manifold:
    build:
      context: ..
    image: ghcr.io/mannilie/manifold:latest
    container_name: manifold
    env_file:
      - ../.env
    environment:
      MANIFOLD_DATA_DIR: /data
    volumes:
      - ../data:/data
    ports:
      # Local development only. On Unraid the port is bound to 127.0.0.1 via the template.
      - "8800:8800"
    restart: unless-stopped
