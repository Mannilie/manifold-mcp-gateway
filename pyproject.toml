[project]
name = "manifold"
version = "0.1.0"
description = "Self-hosted MCP gateway: one image, many connectors"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "mcp>=2.2,<3",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.30",
    "httpx2>=2.12",
    "pydantic>=2.10",
    "jsonschema>=4.23",
    "aiosqlite>=0.21",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manifold"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:manifold"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["manifold"]
